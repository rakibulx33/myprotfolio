# Temporary: fetch the contribution calendar once inside Actions and commit it back to this branch.
name: Probe GitHub contributions
on:
  push:
    branches: ["contrib-probe"]
    paths: [".github/workflows/contrib-probe.yml", "scripts/fetch-github.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch contributions
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/github.json
          git commit -m "Probe: contribution calendar" || echo "no change"
          git push
