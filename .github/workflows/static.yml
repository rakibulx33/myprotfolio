# Build the Vite app and deploy the static output to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver) the page changed.
  # The key file lives at https://rakibulx33.me/2c66087bbdd723d9a5fbb5a8d24f57c4.txt
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Frakibulx33.me%2F&key=2c66087bbdd723d9a5fbb5a8d24f57c4" || true
